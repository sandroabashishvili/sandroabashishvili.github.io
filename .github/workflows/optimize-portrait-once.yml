name: Optimize portrait once

on:
  push:
    paths:
      - .github/workflows/optimize-portrait-once.yml

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Build production portrait and clean temporary fallback
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          png = Path('assets/sandro-portrait.png')
          webp = Path('assets/sandro-portrait.webp')
          css = Path('assets/polish.css')

          img = Image.open(png).convert('RGB')
          if img.width > 1200:
              h = round(img.height * 1200 / img.width)
              img = img.resize((1200, h), Image.Resampling.LANCZOS)
          img.save(webp, 'WEBP', quality=82, method=6)

          text = css.read_text(encoding='utf-8')
          fallback = '''/* The current WebP asset is invalid/over-compressed in production.\n   Use the original portrait as a reliable visual fallback until a new WebP is exported. */\n.portrait-frame {\n  background-image: url("sandro-portrait.png");\n  background-position: center 26%;\n  background-size: cover;\n  background-repeat: no-repeat;\n}\n\n.portrait-frame > img[src$="sandro-portrait.webp"] {\n  opacity: 0;\n}\n\n'''
          if fallback not in text:
              raise SystemExit('Expected temporary portrait fallback block was not found in assets/polish.css')
          css.write_text(text.replace(fallback, ''), encoding='utf-8')

          print('portrait:', img.size, webp.stat().st_size, 'bytes')
          PY

      - name: Remove original production copy and one-time workflow
        run: |
          git rm assets/sandro-portrait.png
          git rm .github/workflows/optimize-portrait-once.yml

      - name: Commit optimized asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/sandro-portrait.webp assets/polish.css
          git commit -m "Optimize portrait asset and remove obsolete fallback"
          git push
