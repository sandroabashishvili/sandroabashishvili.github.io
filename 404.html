<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f1f3ed" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#09110f" media="(prefers-color-scheme: dark)">
  <title>Seite nicht gefunden | Sandro Abashishvili</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/portfolio-app-icon.png">
  <link rel="stylesheet" href="/assets/styles.css">
  <link rel="stylesheet" href="/assets/polish.css">
  <style>
    .not-found { display: grid; min-height: 100dvh; place-items: center; padding: 32px 0; }
    .not-found-card { width: min(720px, calc(100% - 32px)); padding: clamp(32px, 6vw, 64px); border: 1px solid var(--line); border-radius: 28px; background: var(--surface); box-shadow: var(--shadow); }
    .not-found-card h1 { margin-bottom: 18px; }
    .not-found-card p:not(.kicker) { margin: 0 0 28px; color: var(--muted); }
    .not-found-card .button { border-color: var(--green); background: var(--green); color: #fff; text-decoration: none; }
    @media (prefers-color-scheme: dark) { .not-found-card .button { border-color: var(--mint); background: var(--mint); color: #07100d; } }
  </style>
</head>
<body>
  <main class="not-found">
    <section class="not-found-card" aria-labelledby="not-found-title">
      <p class="kicker">404</p>
      <h1 id="not-found-title">Diese Seite wurde nicht gefunden.</h1>
      <p>Die Adresse ist möglicherweise veraltet oder falsch geschrieben.</p>
      <a class="button" href="/">Zurück zum Portfolio</a>
    </section>
  </main>
</body>
</html>
